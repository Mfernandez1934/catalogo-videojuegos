<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar juego</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
        header { background: #263238; color: #fff; padding: 18px 32px; }
        header h1 { margin: 0; font-size: 1.5rem; }
        main { padding: 24px 32px; max-width: 520px; }
        label { display: block; margin-top: 12px; font-weight: 600; }
        input, select { width: 100%; padding: 8px; font-size: 1rem; box-sizing: border-box; }
        .acciones { margin-top: 18px; display: flex; gap: 10px; align-items: center; }
        button { padding: 10px 18px; font-size: 1rem; background: #43a047; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
        .error { background: #ffcdd2; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
    </style>
</head>
<body>
<header><h1>Registrar juego</h1></header>
<main>
    <div class="error" th:if="${error}" th:text="${error}">Error</div>

    <form th:action="@{/juegos}" method="post">
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" th:value="${nombre}" required>

        <label for="genero">Género</label>
        <select id="genero" name="genero" required>
            <option value="">Elegir...</option>
            <option th:each="g : ${generos}" th:value="${g}" th:text="${g.nombreVisible}"
                    th:selected="${g == generoSeleccionado}">Género</option>
        </select>

        <label for="anio">Año de lanzamiento</label>
        <input id="anio" name="anio" type="number" th:value="${anio}" required>

        <label for="plataforma">Plataforma</label>
        <input id="plataforma" name="plataforma" th:value="${plataforma}" placeholder="PC, PS5, Switch...">

        <label for="imagenUrl">URL de la imagen</label>
        <input id="imagenUrl" name="imagenUrl" th:value="${imagenUrl}" placeholder="https://...">

        <div class="acciones">
            <button type="submit">Guardar</button>
            <a th:href="@{/}">Volver al catálogo</a>
        </div>
    </form>
</main>
</body>
</html>
