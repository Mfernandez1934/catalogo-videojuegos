spring.application.name=catalogo-videojuegos

# Puerto 8081: el 8080 lo usa Jenkins por defecto
server.port=8081

# Sesion solo por cookie: evita que las redirecciones agreguen ";jsessionid=..." a la URL (daba 404)
server.servlet.session.tracking-modes=cookie

# Persistencia: H2 en archivo. La carpeta "data" queda junto al jar (en produccion: carpeta de deploy)
spring.datasource.url=jdbc:h2:file:./data/catalogo
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2 en /h2-console (util para mostrar los datos en la defensa)
spring.h2.console.enabled=true

# Actuator: /actuator/health lo usa el pipeline para verificar el deploy
management.endpoints.web.exposure.include=health,info
info.app.version=@project.version@
